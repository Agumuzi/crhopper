# 🚀CR-Hopper
# Public Mihomo / Clash-compatible feed.

mode: rule
log-level: warning
ipv6: false

proxies:
  - name: "🇧🇬BG-310M-[1f11fd/da0831]"
    type: "vless"
    server: "earlytrain.net"
    port: 8443
    uuid: "37af0181-5598-4aad-a040-d926bcb65757"
    udp: true
    encryption: "none"
    servername: "earlytrain.net"
    alpn:
      - "h2"
      - "http/1.1"
    tls: true
    network: "xhttp"
    xhttp-opts:
      path: "/api/v1/upload"
      host: "earlytrain.net"
      mode: "auto"
      reuse-settings:
        c-max-reuse-times: "64-128"
        max-concurrency: "16-32"
        max-connections: 0
      sc-max-each-post-bytes: 1000000
      sc-min-posts-interval-ms: 30
      x-padding-bytes: "100-1000"

  - name: "🇺🇸US-223M-[bdcd75/a1e791]"
    type: "vless"
    server: "204.152.198.135"
    port: 57938
    uuid: "d62f1228-251a-4fa9-a739-093244083cab"
    udp: true
    encryption: "mlkem768x25519plus.native.0rtt.Rej94IYrH64T6AyDB9hNM4Js72UHDSn_DPVlPwVoi2c"
    flow: "xtls-rprx-vision"
    servername: "api.docs.nvidia.com"
    client-fingerprint: "chrome"
    tls: true
    reality-opts:
      public-key: "W_VahGtN28jS59zNCnex-Bfpz2eNVY5VveQwkHoUZgQ"
      short-id: "acb05d85369b"
    network: "tcp"

  - name: "🇺🇸US-67M-[be8dab/f557c4]"
