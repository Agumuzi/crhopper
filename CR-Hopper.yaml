# 🚀CR-Hopper
# Public Mihomo / Clash-compatible feed.

mode: rule
log-level: warning
ipv6: false

proxies:
  - name: "🇸🇪SE-28M-[12b04a/d7c5b3]"
    type: "vless"
    server: "8.6.112.0"
    port: 443
    uuid: "16f63796-3e98-5a7b-b016-540ce6e79007"
    udp: true
    encryption: "none"
    servername: "se1.v2less.site"
    client-fingerprint: "chrome"
    skip-cert-verify: true
    alpn:
      - "h3"
      - "h2"
      - "http/1.1"
    tls: true
    network: "ws"
    ws-opts:
      path: "/vless"
      headers:
        Host: "se1.v2less.site"

proxy-groups:
  - name: "GLOBAL"
    type: select
    proxies:
      - "AUTO"

  - name: "AUTO"
    type: select
    proxies:
      - "🇸🇪SE-28M-[12b04a/d7c5b3]"

rules:
  - "DOMAIN,smtp.gmail.com,DIRECT"
  - "DOMAIN,smtp.googlemail.com,DIRECT"
  - "DOMAIN-SUFFIX,ru,DIRECT"
  - "DOMAIN-SUFFIX,xn--p1ai,DIRECT"
  - "GEOIP,RU,DIRECT"
  - "GEOIP,CN,DIRECT"
  - "MATCH,GLOBAL"
