    type: select
    proxies:
      - "AUTO"

  - name: "AUTO"
    type: select
    proxies:
      - "🇧🇬BG-310M-[1f11fd/da0831]"
      - "🇺🇸US-223M-[bdcd75/a1e791]"
      - "🇺🇸US-67M-[be8dab/f557c4]"

rules:
  - "DOMAIN,smtp.gmail.com,DIRECT"
  - "DOMAIN,smtp.googlemail.com,DIRECT"
  - "DOMAIN-SUFFIX,ru,DIRECT"
  - "DOMAIN-SUFFIX,xn--p1ai,DIRECT"
  - "GEOIP,RU,DIRECT"
  - "GEOIP,CN,DIRECT"
  - "MATCH,GLOBAL"
