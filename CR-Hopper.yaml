# 🚀CR-Hopper
# Public Mihomo / Clash-compatible feed.

mode: rule
log-level: warning
ipv6: false

proxies:
  - name: "🇸🇪SE-37M-[12b04a/d7c5b3]"
    type: "vless"
    server: "8.6.112.0"
    port: 443
    uuid: "16f63796-3e98-5a7b-b016-540ce6e79007"
    udp: true
    encryption: "none"
    servername: "se1.v2less.site"
    client-fingerprint: "chrome"
    skip-cert-verify: true
    alpn:
      - "h3"
      - "h2"
      - "http/1.1"
    tls: true
    network: "ws"
    ws-opts:
      path: "/vless"
      headers:
        Host: "se1.v2less.site"

  - name: "🇩🇪DE-131M-[d7f61e/57cb29]"
    type: "vless"
    server: "vellum.merlano.monster"
    port: 443
    uuid: "5ef70d03-e0fc-462c-9a04-1441f604fbfb"
    udp: true
    encryption: "none"
    servername: "vellum.merlano.monster"
    client-fingerprint: "firefox"
    alpn:
      - "http/1.1"
    tls: true
    network: "ws"
    ws-opts:
      path: "/api/de1/stream"

proxy-groups:
  - name: "GLOBAL"
    type: select
    proxies:
      - "AUTO"

  - name: "AUTO"
    type: select
    proxies:
      - "🇸🇪SE-37M-[12b04a/d7c5b3]"
      - "🇩🇪DE-131M-[d7f61e/57cb29]"

rules:
  - "DOMAIN,smtp.gmail.com,DIRECT"
  - "DOMAIN,smtp.googlemail.com,DIRECT"
  - "DOMAIN-SUFFIX,ru,DIRECT"
  - "DOMAIN-SUFFIX,xn--p1ai,DIRECT"
  - "GEOIP,RU,DIRECT"
  - "GEOIP,CN,DIRECT"
  - "MATCH,GLOBAL"
